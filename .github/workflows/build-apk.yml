name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Race/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout (con Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Godot 4.5.1 y plantillas de exportación
        run: |
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p /tmp/t ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/t
          # Godot 4.5.1: el TPZ contiene la carpeta "templates/" (antes era "export_templates/")
          if [ -d /tmp/t/templates ]; then
            mv /tmp/t/templates ~/.local/share/godot/export_templates/4.5.1.stable
          else
            mv /tmp/t/export_templates ~/.local/share/godot/export_templates/4.5.1.stable
          fi
          test -f ~/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk
          test -f ~/.local/share/godot/export_templates/4.5.1.stable/android_release.apk
          ls ~/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk

      - name: Configurar keystore debug (usa la clave incluida en el repo)
        run: |
          mkdir -p ~/.android ~/.config/godot
          cp "$GITHUB_WORKSPACE/Race/build/debug.keystore" ~/.android/debug.keystore
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          config_version=5

          [export]

          android/debug_keystore="$HOME/.android/debug.keystore"
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          EOF
          echo "--- editor_settings ---"; cat ~/.config/godot/editor_settings-4.5.tres

      - name: Importar recursos del proyecto (headless)
        run: |
          cd "$GITHUB_WORKSPACE/Race"
          godot --headless --editor --import 2>&1 | tee ../import.log

      - name: Exportar APK (debug)
        run: |
          cd "$GITHUB_WORKSPACE/Race"
          mkdir -p ../outputs
          godot --headless --export-debug "Android" "$GITHUB_WORKSPACE/outputs/Race_GT77_Sierra_0.2.1.apk" --verbose 2>&1 | tee ../export.log || true
          test -f "$GITHUB_WORKSPACE/outputs/Race_GT77_Sierra_0.2.1.apk"

      - name: Verificar que el APK contiene el modelo del coche
        run: |
          APK="$GITHUB_WORKSPACE/outputs/Race_GT77_Sierra_0.2.1.apk"
          unzip -l "$APK" | awk '{print $NF}' > /tmp/apk_list.txt
          for nombre in assets/gt77_mobile.glb assets/gt77_mobile_reference_basecolor.png assets/tracks/sierra/sierra_mobile.glb; do
            if grep -qxF "$nombre" /tmp/apk_list.txt; then
              echo "OK: $nombre dentro del APK"
            else
              echo "FALTA: $nombre no esta en el APK"
              grep -iE "gt77|sierra" /tmp/apk_list.txt || true
              exit 1
            fi
          done

      - name: Publicar log en rama ci-logs (solo si falla)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-bot"
          git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/import.log" ci_import.log
          cp "$GITHUB_WORKSPACE/export.log" ci_export.log
          git add ci_import.log ci_export.log
          git diff --cached --quiet || git commit -m "ci: log de export fallida" --quiet
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/yankee2311/Race.git" HEAD:ci-logs

      - name: Subir log de exportación (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            import.log
            export.log
          if-no-files-found: warn

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Race_GT77_Sierra_0.2.1-apk
          path: outputs/*.apk
          if-no-files-found: error
